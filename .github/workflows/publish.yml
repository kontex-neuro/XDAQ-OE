name: Publish XDAQ-OE

on:
    workflow_dispatch:
    push:
        tags:
            - "xdaq-v*"

jobs:
    build:
        uses: ./.github/workflows/build.yml

    merge_macos:
        runs-on: macos-15
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist

            - name: Merge macOS universal bundle
              run: |
                  set -e
                  mkdir dist/output

                  if [[ ! -f dist/mac-arm64/mac-arm64.zip || ! -f dist/mac-x86_64/mac-x86_64.zip ]]; then
                      echo "Missing mac-arm64.zip or mac-x86_64.zip"
                      exit 1
                  fi
                  unzip -q dist/mac-arm64/mac-arm64.zip -d dist/mac-arm64
                  unzip -q dist/mac-x86_64/mac-x86_64.zip -d dist/mac-x86_64

                  ./scripts/merge_universal.sh \
                      dist/mac-arm64/plugins/XDAQ-OE.bundle \
                      dist/mac-x86_64/plugins/XDAQ-OE.bundle \
                      dist/mac-universal/plugins/XDAQ-OE.bundle

            - name: Sign and Notarize macOS universal bundle
              env:
                  MACOS_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.BUILD_CERTIFICATE_PWD }}
                  MACOS_CERTIFICATE_NAME: ${{ secrets.BUILD_CERTIFICATE_NAME }}
                  MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
                  PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
                  PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
                  PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
              run: |
                  set -e

                  echo "Creating keychain"
                  security create-keychain -p $MACOS_CI_KEYCHAIN_PWD build.keychain
                  security default-keychain -s build.keychain
                  echo "Unlocking keychain"
                  security unlock-keychain -p $MACOS_CI_KEYCHAIN_PWD build.keychain

                  echo "Importing certificate"
                  echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
                  security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $MACOS_CI_KEYCHAIN_PWD build.keychain

                  echo "Signing the bundle"
                  codesign --deep --force --strict --verbose --timestamp \
                    --sign "$MACOS_CERTIFICATE_NAME" dist/mac-universal/plugins/XDAQ-OE.bundle
                  echo "Verifying the signed bundle"
                  codesign --verify --verbose=2 dist/mac-universal/plugins/XDAQ-OE.bundle

                  echo "Creating notarization profile"
                  xcrun notarytool store-credentials "notarytool-profile" \
                    --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" \
                    --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" \
                    --password "$PROD_MACOS_NOTARIZATION_PWD"

                  echo "Submitting for notarization"                  
                  ditto -c -k --keepParent \
                    dist/mac-universal/plugins/XDAQ-OE.bundle \
                    dist/mac-universal/XDAQ-OE.bundle.zip
                  xcrun notarytool submit dist/mac-universal/XDAQ-OE.bundle.zip \
                    --keychain-profile "notarytool-profile" --wait

                  echo "Checking signed bundle"
                  codesign --verify --verbose=2 \
                    dist/mac-universal/plugins/XDAQ-OE.bundle

                  echo "Stapling the bundle"
                  xcrun stapler staple dist/mac-universal/plugins/XDAQ-OE.bundle

                  echo "Checking signed bundle"
                  codesign --verify --verbose=2 \
                    dist/mac-universal/plugins/XDAQ-OE.bundle

                  spctl -a -vvv dist/mac-universal/plugins/XDAQ-OE.bundle

                  ditto -c -k --keepParent --rsrc --extattr dist/mac-universal/plugins dist/mac-universal.zip

                  echo "Unzipping the final archive to another folder for verification"
                  ditto -x -k dist/mac-universal.zip dist/mac-universal-verify

                  codesign --verify --verbose=2 \
                    dist/mac-universal-verify/plugins/XDAQ-OE.bundle

                  spctl -a -vvv dist/mac-universal-verify/plugins/XDAQ-OE.bundle

            - name: Upload merged macOS bundle
              uses: actions/upload-artifact@v4
              with:
                  name: mac-universal
                  path: dist/mac-universal.zip

    setup:
        runs-on: ubuntu-24.04
        outputs:
            plugin_api: ${{ steps.api.outputs.plugin_api }}
            version: ${{ steps.ver.outputs.version }}
            is_release: ${{ steps.ver.outputs.is_release }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Extract API Version
              id: api
              run: |
                  set -e
                  git submodule update --init plugin-GUI
                  echo "plugin_api=$(grep plugin-GUI/Source/Processors/PluginManager/OpenEphysPlugin.h \
                    -e '#define PLUGIN_API_VER' | \
                    sed -E 's/^#define[[:space:]]+PLUGIN_API_VER[[:space:]]+([0-9]+)/\1/')" >> $GITHUB_OUTPUT

            - name: Determine version
              id: ver
              run: |
                  set -e
                  if [[ "${{ github.ref }}" == refs/tags/xdaq-v* ]]; then
                      echo "version=${GITHUB_REF_NAME#xdaq-v}" >> $GITHUB_OUTPUT
                      echo "is_release=true" >> $GITHUB_OUTPUT
                  else
                      echo "Not a release tag: $GITHUB_REF_NAME, using dummy version 0.0.0 (upload will be skipped)"
                      echo "version=0.0.0" >> $GITHUB_OUTPUT
                      echo "is_release=false" >> $GITHUB_OUTPUT
                  fi

    publish_windows:
        runs-on: ubuntu-24.04
        needs: [build, setup]
        env:
            WIN_ZIP: XDAQ-windows_${{ needs.setup.outputs.version }}-API${{ needs.setup.outputs.plugin_api }}.zip

        steps:
            - name: Download windows artifact
              uses: actions/download-artifact@v8
              with:
                  name: windows-x86_64
                  path: dist

            - name: Repack windows zip
              run: |
                  set -e

                  if [[ ! -f dist/windows-x86_64.zip ]]; then
                      echo "Missing dist/windows-x86_64.zip"
                      exit 1
                  fi

                  # FIXME: remove hacks below once open-ephys/plugin-GUI#678 is fixed.
                  # The plugin installer reads the dll name from zip entry 0 (Windows), but fails to strip
                  # the "plugins/" prefix because it searches for a backslash while zip entries use "/".
                  # Workarounds: keep plugins/XDAQ-OE.dll as the first real entry, and prepend a zero-byte
                  # "XDAQ-OE.dll" dummy entry whose prefix-less name the installer reads as-is.
                  7za x dist/windows-x86_64.zip -odist/windows-repack
                  rm dist/windows-x86_64.zip
                  cd dist/windows-repack
                  touch XDAQ-OE.dll  # zero-byte dummy; the real dll lives in plugins/
                  7za a "../$WIN_ZIP" XDAQ-OE.dll
                  rm XDAQ-OE.dll
                  7za a "../$WIN_ZIP" plugins/XDAQ-OE.dll
                  7za a "../$WIN_ZIP" shared/XDAQ-OE
                  cd ../..
                  rm -rf dist/windows-repack
                  echo "Created: dist/$WIN_ZIP"

            - name: Upload to Artifactory
              if: needs.setup.outputs.is_release == 'true'
              env:
                  ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
              run: |
                  set -e

                  if [[ -z "$ARTIFACTORY_ACCESS_TOKEN" ]]; then
                      echo "No Artifactory API key set, skipping upload"
                      exit 0
                  fi

                  curl -fSL -H "X-JFrog-Art-Api:$ARTIFACTORY_ACCESS_TOKEN" -T "dist/$WIN_ZIP" \
                    "https://openephys.jfrog.io/artifactory/XDAQ-plugin/windows/$WIN_ZIP"

            - name: Upload dist folder
              uses: actions/upload-artifact@v7
              with:
                  name: dist-windows
                  path: dist

    publish_mac:
        runs-on: ubuntu-24.04
        needs: [merge_macos, setup]
        env:
            MAC_ZIP: XDAQ-mac_${{ needs.setup.outputs.version }}-API${{ needs.setup.outputs.plugin_api }}.zip

        steps:
            - name: Download mac artifact
              uses: actions/download-artifact@v8
              with:
                  name: mac-universal
                  path: dist

            - name: Prepare mac zip
              run: |
                  set -e

                  if [[ ! -f dist/mac-universal.zip ]]; then
                      echo "Missing dist/mac-universal.zip"
                      exit 1
                  fi

                  mv dist/mac-universal.zip "dist/$MAC_ZIP"
                  echo "Created: dist/$MAC_ZIP"

            - name: Upload to Artifactory
              if: needs.setup.outputs.is_release == 'true'
              env:
                  ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
              run: |
                  set -e

                  if [[ -z "$ARTIFACTORY_ACCESS_TOKEN" ]]; then
                      echo "No Artifactory API key set, skipping upload"
                      exit 0
                  fi

                  curl -fSL -H "X-JFrog-Art-Api:$ARTIFACTORY_ACCESS_TOKEN" -T "dist/$MAC_ZIP" \
                    "https://openephys.jfrog.io/artifactory/XDAQ-plugin/mac/$MAC_ZIP"

            - name: Upload dist folder
              uses: actions/upload-artifact@v7
              with:
                  name: dist-mac
                  path: dist

    publish_linux:
        runs-on: ubuntu-24.04
        needs: [build, setup]
        env:
            LINUX_ZIP: XDAQ-linux_${{ needs.setup.outputs.version }}-API${{ needs.setup.outputs.plugin_api }}.zip

        steps:
            - name: Download linux artifact
              uses: actions/download-artifact@v8
              with:
                  name: linux-x86_64
                  path: dist

            - name: Prepare linux zip
              run: |
                  set -e

                  if [[ ! -f dist/linux-x86_64.zip ]]; then
                      echo "Missing dist/linux-x86_64.zip"
                      exit 1
                  fi

                  mv dist/linux-x86_64.zip "dist/$LINUX_ZIP"
                  echo "Created: dist/$LINUX_ZIP"

            - name: Upload to Artifactory
              if: needs.setup.outputs.is_release == 'true'
              env:
                  ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
              run: |
                  set -e

                  if [[ -z "$ARTIFACTORY_ACCESS_TOKEN" ]]; then
                      echo "No Artifactory API key set, skipping upload"
                      exit 0
                  fi

                  curl -fSL -H "X-JFrog-Art-Api:$ARTIFACTORY_ACCESS_TOKEN" -T "dist/$LINUX_ZIP" \
                    "https://openephys.jfrog.io/artifactory/XDAQ-plugin/linux/$LINUX_ZIP"

            - name: Upload dist folder
              uses: actions/upload-artifact@v7
              with:
                  name: dist-linux
                  path: dist
